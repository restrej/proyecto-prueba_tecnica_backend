# -----------------------------------------------------------------------------
# cleanup-job: tarea programada que borra notificaciones con más de 24 horas.
# (Se usa Poetry, como en el resto de servicios, en lugar de requirements.txt:
#  la prueba exige "Dependencies managed with Poetry".)
# -----------------------------------------------------------------------------
[project]
name = "cleanup-job"
version = "1.0.0"
description = "Borra periódicamente notificaciones antiguas de MongoDB (APScheduler)"
requires-python = ">=3.11,<4.0"
dependencies = [
    "cafe-common",
    "fastapi>=0.115,<1",           # API mínima: /health, /metrics, /jobs/cleanup/run
    "uvicorn[standard]>=0.32,<1",
    "pydantic-settings>=2.6,<3",
    "pymongo>=4.10,<5",
    "apscheduler>=3.10,<4",        # planificador de tareas en proceso
]

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
cafe-common = { path = "../shared", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3"
pytest-asyncio = ">=0.24"
httpx = ">=0.28"
ruff = ">=0.8"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.lint.isort]
# "alembic/" es una carpeta local, pero el paquete alembic es de terceros.
known-third-party = ["alembic"]
known-first-party = ["app", "cafe_common"]
