# Configuración de Alembic (migraciones de esquema).
# La URL de la base de datos NO se escribe aquí: env.py la lee de la variable
# de entorno DATABASE_URL a través de app.config.Settings.

[alembic]
# Carpeta con env.py y las versiones de migración.
script_location = alembic
# Nombre de archivo de cada migración: fecha + revisión + descripción.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
# Añade el directorio actual al sys.path para poder importar "app".
prepend_sys_path = .
# Separador de rutas del sistema operativo (evita el aviso de deprecación).
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
